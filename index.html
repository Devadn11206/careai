  <style>
    /* ============================================
       DESIGN TOKENS & SYSTEM VARIABLES
    ============================================ */
    :root {
      /* Light Mode Tokens (Medical Professional) */
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      --bg-surface: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      
      --accent-primary: #3b82f6; /* Blue */
      --accent-secondary: #10b981; /* Emerald */
      --accent-pulse: #f43f5e; /* Rose */
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-invert: #ffffff;

      --neon-glow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    .dark {
      /* Dark Mode Tokens (Bioluminescent Space) */
      --bg-gradient: radial-gradient(circle at top left, rgba(0, 212, 255, 0.05), transparent 30%),
                     radial-gradient(circle at bottom right, rgba(255, 0, 110, 0.05), transparent 30%),
                     linear-gradient(180deg, #050a14 0%, #02050d 100%);
      --bg-surface: #0a1628;
      --glass-bg: rgba(5, 10, 20, 0.65);
      --glass-border: rgba(0, 212, 255, 0.12);
      --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 212, 255, 0.05);

      --accent-primary: #00d4ff; /* Electric Cyan */
      --accent-secondary: #00ffb3; /* Bio Green */
      --accent-pulse: #ff006e; /* Neon Pink */

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-invert: #050a14;

      --neon-glow: 0 0 25px rgba(0, 212, 255, 0.4);
    }

    /* ============================================
       BASE STYLES
    ============================================ */
    body {
      font-family: 'DM Sans', 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
    }

    html {
      scroll-behavior: smooth;
    }

    h1, h2, h3, .font-display, .font-orbitron {
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      letter-spacing: -0.01em;
    }

    /* ============================================
       GLASSMORPHISM SYSTEM
    ============================================ */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      box-shadow: var(--glass-shadow), 0 0 15px rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }

    /* ============================================
       ANIMATIONS
    ============================================ */
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .aurora-bg {
      background: linear-gradient(-45deg, #00d4ff20, #00ffb310, #ff006e15, #3b82f610);
      background-size: 400% 400%;
      animation: aurora 15s ease infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .animate-float { animation: float 6s ease-in-out infinite; }

    @keyframes neon-pulse {
      0%, 100% { box-shadow: 0 0 15px var(--accent-primary); opacity: 0.8; }
      50% { box-shadow: 0 0 35px var(--accent-primary); opacity: 1; }
    }

    .neon-pulse { animation: neon-pulse 3s infinite; }

    /* ============================================
       UI UTILITIES
    ============================================ */
    .premium-gradient-text {
      background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 10px;
      opacity: 0.5;
    }

    /* ============================================
       RESPONSIVE REFINEMENTS
    ============================================ */
    @media (max-width: 768px) {
      .glass-card { backdrop-filter: blur(12px); }
    }

    /* Print settings */
    @media print {
      body { background: white; color: black; }
      .glass-card { border: 1px solid #ccc; box-shadow: none; backdrop-filter: none; }
      .no-print { display: none !important; }
    }
  </style>
