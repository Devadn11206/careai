<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareXAI - Healthcare Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CareXAI" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            // Blue primary (trustworthy medical)
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb', // Main Brand Color
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            // Teal secondary (calm + wellness)
            secondary: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            },
            // Neutral Slate for text and backgrounds
            slate: {
              50: '#F8FAFC', // App background
              100: '#f3f4f6',
              200: '#e5e7eb',
              300: '#d1d5db',
              400: '#9ca3af',
              500: '#6b7280',
              600: '#4b5563',
              700: '#374151',
              800: '#1f2937',
              900: '#111827',
              950: '#030712',
            },
            // Status Colors
            danger: '#ef4444',
            warning: '#f59e0b',
            success: '#10b981',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Motion helpers (lightweight, global) */
    @keyframes cxai-blob {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      33% {
        transform: translate3d(18px, -22px, 0) scale(1.06);
      }
      66% {
        transform: translate3d(-14px, 16px, 0) scale(0.98);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .animate-blob {
      animation: cxai-blob 12s ease-in-out infinite;
      will-change: transform;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }

    @keyframes cxai-gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .cxai-gradient-motion {
      background: radial-gradient(1200px 700px at 10% 0%, rgba(37, 99, 235, 0.16), transparent 60%),
        radial-gradient(1000px 600px at 90% 10%, rgba(20, 184, 166, 0.12), transparent 60%),
        radial-gradient(1000px 600px at 50% 100%, rgba(99, 102, 241, 0.10), transparent 60%),
        linear-gradient(120deg, rgba(248, 250, 252, 1), rgba(239, 246, 255, 0.55), rgba(248, 250, 252, 1));
      background-size: 200% 200%;
      animation: cxai-gradient 18s ease-in-out infinite;
      will-change: background-position;
    }

    /* Global Dark Mode Transitions */
    body,
    div,
    nav,
    button,
    input,
    select,
    textarea,
    span,
    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      transition-property: background-color, border-color, color, fill, stroke;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 300ms;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #2563EB;
      border-radius: 3px;
      opacity: 0.5;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #14B8A6;
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background: white;
      }

      body * {
        visibility: hidden;
      }

      .print-passport,
      .print-passport * {
        visibility: visible;
      }

      .print-passport {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        background: white;
      }

      .print-hidden {
        display: none !important;
      }

      .recharts-wrapper {
        break-inside: avoid;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26"
  }
}
</script>
</head>

<body
  class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-primary-100 selection:text-primary-900">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
